name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        working-directory: KashDuv
        env:
          KASHDUV_ADMIN_PASSWORD: ci-test-password
        run: ./mvnw test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kash-frontend/package-lock.json
      - name: Frontend build
        working-directory: kash-frontend
        env:
          DISABLE_ESLINT_PLUGIN: true
        run: npm ci && npm run build