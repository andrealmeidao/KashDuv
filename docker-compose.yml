services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kashduv
      POSTGRES_USER: ${POSTGRES_USER:-kashduv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./KashDuv
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      KASHDUV_ADMIN_PASSWORD: ${KASHDUV_ADMIN_PASSWORD:?Defina KASHDUV_ADMIN_PASSWORD}
    depends_on:
      - db
    ports:
      - "8081:8081"

  frontend:
    build: ./kash-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data: