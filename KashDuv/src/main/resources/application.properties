server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/KashDuv}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:AndreAlmeida}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.security.default-username=${APP_SECURITY_DEFAULT_USERNAME:AndreAlmeida}
app.security.default-password=${KASHDUV_ADMIN_PASSWORD:}
