server.port=8081
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/kashduv}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kashduv}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.default-username=${APP_SECURITY_DEFAULT_USERNAME:admin}